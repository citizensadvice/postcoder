name: Publish to ECR

on:
  workflow_run:
    workflows: [test]
    types:
      - completed

  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-22.04
    steps:
      - name: Build and push to ECR
        uses: citizensadvice/build-and-push-action@2673f014a3a9e28daae39c71949949155fad937d
        with:
          aws_access_key: ${{ secrets.PUBLIC_PUSH_ECR_AWS_KEY }}
          aws_secret_key: ${{ secrets.PUBLIC_PUSH_ECR_AWS_SECRET }}
          dockerfile_context: "."
          repository_name: postcoder
          multiarch_build: "enabled"
          auth_token: ${{ secrets.GITHUB_TOKEN }}
